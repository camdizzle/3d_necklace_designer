name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit and API tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install a browser for the smoke test
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: npm run smoke
